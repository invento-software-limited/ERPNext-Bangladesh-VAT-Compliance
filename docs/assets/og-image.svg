<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6e3a"/>
      <stop offset="100%" stop-color="#094a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="180" fill="#ffffff" opacity="0.04"/>
  <circle cx="1100" cy="500" r="260" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="550" r="140" fill="#ffffff" opacity="0.05"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <!-- Content -->
  <text x="70" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">Bangladesh VAT Compliance</text>
  <text x="70" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.85)" letter-spacing="0.01em">Automated VAT management for ERPNext</text>
  <!-- Badge -->
  <rect x="70" y="310" width="200" height="40" rx="20" fill="#e63946" opacity="0.9"/>
  <text x="170" y="337" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Documentation</text>
  <!-- Feature pills -->
  <rect x="70" y="380" width="280" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
  <text x="210" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">Mushak 6.1 · 6.2 · 6.3</text>
  <rect x="370" y="380" width="260" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
  <text x="500" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">VDS Management</text>
  <rect x="650" y="380" width="280" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
  <text x="790" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#ffffff" text-anchor="middle">Treasury Deposits</text>
  <!-- Footer -->
  <text x="70" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.5)">Invento Software Limited</text>
  <!-- Flag elements -->
  <rect x="1060" y="60" width="80" height="52" rx="4" fill="#ffffff"/>
  <circle cx="1100" cy="86" r="14" fill="#e63946"/>
</svg>
