<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangladesh VAT Compliance — Documentation</title>
  <meta name="description" content="Documentation for the ERPNext Bangladesh VAT Compliance app — Product Overview & User Guide" />
  <meta name="theme-color" content="#0d6e3a" />

  <!-- marked.js for client-side markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #094a26;
      --green-700: #0d6e3a;
      --green-600: #128a47;
      --green-500: #1ba05a;
      --green-50: #edfaf3;
      --red-500: #e63946;
      --red-50: #fde8ea;
      --gold-500: #d4a017;
      --gray-50: #f8f9fa;
      --gray-100: #f1f3f5;
      --gray-200: #e9ecef;
      --gray-300: #dee2e6;
      --gray-400: #adb5bd;
      --gray-500: #868e96;
      --gray-600: #495057;
      --gray-700: #343a40;
      --gray-800: #212529;
      --gray-900: #1a1a2e;
      --white: #ffffff;
      --sidebar-width: 300px;
      --header-height: 64px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SF Mono", SFMono-Regular, "Fira Code", "Fira Mono", Menlo, monospace;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.7;
      color: var(--gray-800);
      background: var(--gray-50);
      display: flex;
      min-height: 100vh;
    }

    a { color: var(--green-700); text-decoration: none; }
    a:hover { color: var(--green-500); text-decoration: underline; }

    img { max-width: 100%; height: auto; display: block; }
    code { font-family: var(--font-mono); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--white);
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 24px 24px 20px;
      border-bottom: 1px solid var(--gray-100);
      flex-shrink: 0;
    }

    .sidebar-brand-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--green-700), var(--green-500));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(13, 110, 58, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-900);
      line-height: 1.3;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .sidebar-nav {
      padding: 16px 12px;
      flex: 1;
    }

    .sidebar-nav-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gray-400);
      padding: 8px 12px 6px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--gray-600);
      font-size: 15px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      margin-bottom: 2px;
    }

    .nav-btn:hover {
      background: var(--gray-100);
      color: var(--gray-800);
    }

    .nav-btn.active {
      background: var(--green-50);
      color: var(--green-700);
      font-weight: 600;
    }

    .nav-btn .nav-icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .nav-btn .badge {
      margin-left: auto;
      font-size: 11px;
      background: var(--gray-200);
      color: var(--gray-500);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    .nav-btn.active .badge {
      background: var(--green-700);
      color: var(--white);
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--gray-100);
      flex-shrink: 0;
    }

    .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--gray-500);
    }

    .sidebar-footer a:hover { color: var(--gray-700); }

    /* ===== MAIN CONTENT ===== */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-height: 100vh;
      padding: 0;
    }

    /* Top bar (mobile) */
    .topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 99;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 0 16px;
      height: var(--header-height);
      align-items: center;
      gap: 12px;
    }

    .hamburger {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 8px;
      padding: 8px;
    }

    .hamburger:hover { background: var(--gray-100); }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2.5px;
      background: var(--gray-700);
      border-radius: 2px;
      transition: 0.3s;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-800);
    }

    /* ===== CONTENT AREA ===== */
    .content-area {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 48px 80px;
    }

    /* Loading state */
    .content-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--gray-400);
    }

    .content-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--green-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .content-error {
      text-align: center;
      padding: 60px 20px;
      color: var(--red-500);
    }

    /* ===== MARKDOWN RENDERED STYLES ===== */
    .markdown-body {
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .markdown-body h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--gray-900);
      line-height: 1.25;
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 3px solid var(--green-700);
      display: inline-block;
    }

    .markdown-body h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--green-700);
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--gray-200);
    }

    .markdown-body h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--gray-800);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }

    .markdown-body h4 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .markdown-body p {
      margin-bottom: 1.1rem;
      color: var(--gray-700);
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.2rem;
      padding-left: 1.5rem;
    }

    .markdown-body li {
      margin-bottom: 0.35rem;
    }

    .markdown-body li > ul, .markdown-body li > ol {
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .markdown-body strong {
      font-weight: 700;
      color: var(--gray-900);
    }

    .markdown-body em {
      font-style: italic;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--gray-200);
      margin: 2rem 0;
    }

    /* Blockquotes */
    .markdown-body blockquote {
      border-left: 4px solid var(--green-600);
      background: var(--green-50);
      padding: 0.75rem 1.25rem;
      margin: 1.25rem 0;
      border-radius: 0 8px 8px 0;
      color: var(--gray-700);
    }

    .markdown-body blockquote p:last-child { margin-bottom: 0; }

    /* Code */
    .markdown-body code {
      background: var(--gray-100);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.875em;
      color: var(--red-500);
    }

    .markdown-body pre {
      background: var(--gray-900);
      color: #e9ecef;
      padding: 16px 20px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 1.25rem 0;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .markdown-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      border-radius: 0;
      font-size: inherit;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.95rem;
    }

    .markdown-body th {
      background: var(--green-700);
      color: var(--white);
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
    }

    .markdown-body th:first-child { border-radius: 8px 0 0 0; }
    .markdown-body th:last-child { border-radius: 0 8px 0 0; }

    .markdown-body td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--gray-200);
    }

    .markdown-body tr:last-child td { border-bottom: none; }
    .markdown-body tr:nth-child(even) td { background: var(--gray-50); }

    /* Images */
    .markdown-body img {
      margin: 1.5rem auto;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border: 1px solid var(--gray-200);
      max-height: 600px;
      object-fit: contain;
      background: var(--white);
    }

    /* Lists with emoji icons */
    .markdown-body ul li::marker {
      color: var(--green-600);
    }

    /* ===== OVERLAY (mobile) ===== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .sidebar-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .topbar { display: flex; }
      .main { margin-left: 0; }
      .content-area { padding: 24px 20px 60px; }
      .sidebar-overlay { display: block; }
      .markdown-body h1 { font-size: 1.65rem; }
      .markdown-body h2 { font-size: 1.25rem; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .content-area { padding: 32px 28px 60px; }
    }

    /* ===== PRINT ===== */
    @media print {
      .sidebar, .topbar, .sidebar-overlay { display: none !important; }
      .main { margin-left: 0; }
      .content-area { padding: 20px; max-width: 100%; }
      .markdown-body img { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Documentation navigation">
    <div class="sidebar-brand">
      <div class="sidebar-brand-inner">
        <div class="brand-icon">BD</div>
        <div class="brand-text">
          <span class="brand-name">VAT Compliance</span>
          <span class="brand-sub">ERPNext Bangladesh</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-nav-label">Documentation</div>

      <button class="nav-btn active" data-page="overview" onclick="switchPage('overview')">
        <span class="nav-icon">📘</span>
        Product Overview
      </button>

      <button class="nav-btn" data-page="guide" onclick="switchPage('guide')">
        <span class="nav-icon">📖</span>
        User Guide
      </button>
    </nav>

    <div class="sidebar-footer">
      <a href="https://github.com/invento-software-limited/ERPNext-Bangladesh-VAT-Compliance" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </div>
  </aside>

  <!-- ===== OVERLAY (mobile) ===== -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- ===== TOPBAR (mobile) ===== -->
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <span class="topbar-title" id="topbarTitle">Product Overview</span>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main">
    <div class="content-area" id="content">
      <div class="content-loading">
        <div class="spinner"></div>
        <span>Loading documentation…</span>
      </div>
    </div>
  </main>

  <script>
    // ---- Configuration ----
    const PAGES = {
      overview: {
        file: 'product_overview.md',
        title: 'Product Overview',
        emoji: '📘',
      },
      guide: {
        file: 'user_guide.md',
        title: 'User Guide',
        emoji: '📖',
      },
    };

    let currentPage = 'overview';
    let cachedContent = {};

    // ---- Sidebar toggling (mobile) ----
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
      document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
      document.body.style.overflow = '';
    }

    // ---- Markdown rendering ----
    function renderMarkdown(text) {
      // Set marked options
      marked.setOptions({
        breaks: true,
        gfm: true,
      });

      // Pre-process: fix image paths (ensure ./assets/ works)
      // Also handle emoji shortcodes (the .md already has raw emoji, so this is fine)
      const html = marked.parse(text);

      // Post-process: add target="_blank" to external links, wrap tables
      const div = document.createElement('div');
      div.className = 'markdown-body';
      div.innerHTML = html;

      // External links
      div.querySelectorAll('a').forEach(a => {
        if (a.hostname && a.hostname !== location.hostname) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener');
        }
      });

      // Smooth scroll for anchor links
      div.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          const id = a.getAttribute('href').slice(1);
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        });
      });

      return div;
    }

    // ---- Load and display a page ----
    async function loadPage(pageKey) {
      const page = PAGES[pageKey];
      if (!page) return;

      const contentEl = document.getElementById('content');

      // If cached, render immediately
      if (cachedContent[pageKey]) {
        contentEl.innerHTML = '';
        contentEl.appendChild(cachedContent[pageKey].cloneNode(true));
        updateActiveNav(pageKey);
        document.title = `${page.title} — Bangladesh VAT Compliance`;
        document.getElementById('topbarTitle').textContent = page.title;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Show loading
      contentEl.innerHTML = `
        <div class="content-loading">
          <div class="spinner"></div>
          <span>Loading ${page.title}…</span>
        </div>
      `;

      try {
        const response = await fetch(page.file);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        const text = await response.text();

        const rendered = renderMarkdown(text);
        cachedContent[pageKey] = rendered.cloneNode(true);

        contentEl.innerHTML = '';
        contentEl.appendChild(rendered);

        updateActiveNav(pageKey);
        document.title = `${page.title} — Bangladesh VAT Compliance`;
        document.getElementById('topbarTitle').textContent = page.title;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Close sidebar on mobile after navigation
        closeSidebar();
      } catch (err) {
        console.error('Failed to load page:', err);
        contentEl.innerHTML = `
          <div class="content-error">
            <p style="font-size:2rem;margin-bottom:8px;">⚠️</p>
            <p style="font-size:1.1rem;font-weight:600;color:var(--gray-700);margin-bottom:4px;">Failed to load documentation</p>
            <p style="color:var(--gray-500);font-size:0.9rem;">${err.message}</p>
            <p style="margin-top:16px;">
              <button onclick="location.reload()" style="padding:8px 20px;background:var(--green-700);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;">Retry</button>
            </p>
          </div>
        `;
      }
    }

    // ---- Page switching ----
    function switchPage(pageKey) {
      if (pageKey === currentPage) return;
      currentPage = pageKey;
      loadPage(pageKey);
    }

    function updateActiveNav(pageKey) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === pageKey);
      });
    }

    // ---- Keyboard shortcuts ----
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSidebar();
      if (e.ctrlKey || e.metaKey) return;
      if (e.key === '1') switchPage('overview');
      if (e.key === '2') switchPage('guide');
    });

    // ---- Load default page on DOM ready ----
    document.addEventListener('DOMContentLoaded', () => loadPage('overview'));
    // Fallback if DOM already loaded
    if (document.readyState !== 'loading') loadPage('overview');

    // ---- Service worker registration (optional, for offline) ----
    // if ('serviceWorker' in navigator) {
    //   navigator.serviceWorker.register('/sw.js');
    // }
  </script>
</body>
</html>
